name: admin_panel
description: "İSTE admin paneli (web)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # iste_v3'ün lib/ kodunu (modeller, repository'ler, provider'lar) reuse
  # etmek için path dependency — monorepo/melos gerektirmez.
  iste_v3:
    path: ../

  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^14.8.1

  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  cloud_functions: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.0+1

flutter:
  uses-material-design: true
